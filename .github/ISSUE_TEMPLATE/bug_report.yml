name: Bug report
description: Report a reproducible problem in YEARCORE
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open YEARCORE
        2. Select year / mode
        3. ...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Browser and operating system
      placeholder: e.g. Firefox 145 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or other details
